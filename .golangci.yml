---
version: "2"

linters:
  default: all
  disable:
    # Style preferences - overly opinionated for this codebase
    - wsl
    - wsl_v5
    - nlreturn
    - godot
    - exhaustruct
    - varnamelen
    - gochecknoglobals
    - cyclop
    - funlen
    - gocognit
    - maintidx
    - depguard
    - forbidigo
    - err113
    - mnd
    - nestif
    - lll
    - tagliatelle
    - funcorder
    - wrapcheck
    - perfsprint
    - testpackage
